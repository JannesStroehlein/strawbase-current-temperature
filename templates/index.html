<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="60">
  <title>Living Room Temperature</title>
  <style>
    :root {
      --accent: {{ accent }};
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1f2937, #0b1120 70%);
      color: #e5e7eb;
      padding: 1.5rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 3rem 3.5rem;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      max-width: 420px;
      width: 100%;
    }
    .label {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }
    .temp {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
    }
    .temp .unit {
      font-size: 2rem;
      font-weight: 500;
      color: #9ca3af;
      margin-left: 0.25rem;
    }
    .updated {
      margin-top: 1.75rem;
      font-size: 0.9rem;
      color: #6b7280;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.4rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="label">Living Room</div>
    <div class="temp">{{ value }}<span class="unit">{{ unit }}</span></div>
    <div class="updated"><span class="dot"></span>Updated {{ updated }}</div>
  </main>
</body>
</html>
